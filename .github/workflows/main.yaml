name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet backend
        run: go vet ./...

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Type-check frontend
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Build (and push on main)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The compose file in nomad_gitops pins tag AND digest. Nothing else
      # moves that pin, so without the steps below a build reaches the
      # registry and stops there. The push of the pin to nomad_gitops main
      # is the deploy: its webhook runs the Komodo procedure
      # personal-reconcile, which deploys every stack whose files changed.

      - name: Check out gitops
        if: github.event_name == 'push'
        uses: actions/checkout@v7
        with:
          repository: rogerxaic/nomad_gitops
          ref: main
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}
          path: gitops

      - name: Pin the new image
        if: github.event_name == 'push'
        working-directory: gitops
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          FILE=komodo/stacks/jdli-pi/escl-scanner/compose.yaml
          NEW="ghcr.io/rogerxaic/escl-scanner-2-merger:sha-${GITHUB_SHA}@${DIGEST}"

          # Anchored on the `scanner` service's image line. `bridge` above it is
          # built by hand, exists in no registry, and must not be touched.
          python3 - "$FILE" "$NEW" <<'PY'
          import re, sys
          path, new = sys.argv[1], sys.argv[2]
          src = open(path).read()
          pat = re.compile(r'(?<=^    image: )ghcr\.io/rogerxaic/escl-scanner-2-merger:\S+$', re.M)
          out, n = pat.subn(new, src)
          if n != 1:
              sys.exit(f"expected exactly 1 scanner image line, found {n}")
          open(path, "w").write(out)
          PY

          git config user.name  "scanner-ci"
          git config user.email "scanner-ci@users.noreply.github.com"
          git add "$FILE"
          if git diff --cached --quiet; then
            echo "digest unchanged, nothing to commit"
          else
            git commit -m "scanner: ${GITHUB_SHA:0:7}"
            git push origin main
          fi
